name: build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Re-build all images at 2am UTC every Monday (8pm CST/9pm CDT)
    #
    # This ensures we always start with a recent base image, which
    # reduces wasted space due to written-over files in the writable
    # layer, ensures packages are up-to-date (since many of these
    # images install the latest versions of packages available at
    # build time), and allow us to ensure that images continue to
    # be buildable from source (no removed packages).
    #
    # See: https://crontab.guru/#0_2_*_*_1
    - cron: "0 2 * * 1"

  workflow_dispatch:

permissions: {}

jobs:
  # Quick checks, running linters, checking formatting, etc
  quick:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Cancel previous runs
        if: github.event_name == 'pull_request'
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6

  # Builds every image in Depot. Holds no Docker Hub credentials, so pull requests build here too.
  images:
    runs-on: ubuntu-latest
    name: images/ubuntu
    permissions:
      actions: read
      contents: read
      id-token: write # Depot authenticates with OIDC
    steps:
      - name: Cancel previous runs
        if: github.event_name == 'pull_request'
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        with:
          oidc: true

      - name: Build ubuntu images
        run: |
          "$GITHUB_WORKSPACE/scripts/build_images.sh" \
            --tag=ubuntu

      # The Depot build IDs (scripts/build_<image>.json) that push_images.sh pushes from.
      - name: Upload build IDs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: depot-builds
          path: scripts/build_*.json
          if-no-files-found: error
          retention-days: 1

  # Pushes the images built above to Docker Hub (codercom/example-* and codercom/enterprise-*),
  # from main only. Docker Hub trusts the OIDC subject repo:coder/images:environment:publish, and
  # the publish environment accepts main only, so no other branch, pull request or workflow can push.
  push:
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # Depot and Docker Hub authenticate with OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build IDs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: depot-builds
          path: scripts

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        with:
          oidc: true

      # Exchanges the GitHub OIDC token for a short-lived Docker Hub token. Requires the OIDC
      # connection in Docker Home (Identity & auth > OIDC connections); its ID is the publish
      # environment's DOCKERHUB_OIDC_CONNECTIONID variable.
      - name: Authenticate to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: codercom
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Push images to Docker Hub
        run: |
          "$GITHUB_WORKSPACE/scripts/push_images.sh" \
            --tag=ubuntu
